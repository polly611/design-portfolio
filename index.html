ames slide{to{transform:translateX(-50%)}}#editLogos{display:grid;gap:10px;margin:16px 0 26px}.logo-row{display:flex;align-items:center;gap:14px;min-height:108px;padding:10px 14px;border:1px solid #d6d4ce;background:#fff}.logo-row.dragging{opacity:.55;border-color:#252521}.logo-preview{position:relative;width:180px;height:84px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid #d6d4ce;background:linear-gradient(90deg,#f5f5f2 0 50%,#30363b 50% 100%);overflow:hidden}.logo-preview img{display:block;width:100%;height:100%;padding:10px;object-fit:contain;box-sizing:border-box}.logo-preview-error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#f5f5f2;color:#9a3333;font-size:12px}.logo-preview.failed .logo-preview-error{display:flex}.logo-preview.failed img{display:none}.logo-name{flex:1;min-width:150px;font-size:13px;color:#666}.logo-name input{margin:4px 0 0;font-size:14px;padding:8px}.logo-index{min-width:2.5em;color:#888;font:13px monospace}.logo-handle{cursor:grab;touch-action:none;user-select:none;font-size:22px;line-height:1;padding:10px 8px}.logo-handle:active{cursor:grabbing}.logo-actions{display:flex;gap:6px;margin-left:auto}.logo-actions button{padding:7px 11px}.logo-actions button:disabled{opacity:.35;cursor:default}@media(max-width:650px){.logo-row{gap:8px;padding:8px;flex-wrap:wrap}.logo-preview{width:140px;height:70px}.logo-name{min-width:calc(100% - 220px)}.logo-actions{width:100%;justify-content:flex-end}.logo-actions button{padding:6px 8px}}button{padding:12px 20px;border:1px solid #aaa;background:transparent;cursor:pointer}button:hover{background:#252521;color:white}dialog{border:0;background:#f4f2ec;width:min(1000px,95vw);max-height:90vh;padding:32px}dialog::backdrop{background:#0009}dialog img{width:100%;height:auto}input,textarea,select{width:100%;padding:12px;margin:7px 0 16px;border:1px solid #ccc;background:#fff;font:inherit}label{display:block}textarea{min-height:100px}.close{float:right}.admin-row{border-top:1px solid #ccc;padding:20px 0}.status{white-space:pre-wrap}footer{padding-bottom:60px}.contact{font-size:clamp(35px,6vw,80px)}@media(max-width:650px){.grid,.more,.about{grid-template-columns:1fr}nav{gap:12px;font-size:12px}.intro{display:block}h1{letter-spacing:-3px}section{padding:40px 0}}@media(prefers-reduced-motion:reduce){.track{animation:none}}.all-work-entry{text-align:center;padding:100px 0 120px;border-bottom:1px solid #ccc}.all-work-button{display:inline-flex;align-items:center;gap:22px;border:1px solid #ccc;padding:25px 40px;font-size:20px}.all-work-button span{font:14px monospace;letter-spacing:1px}.all-work-button:hover{background:#252521;color:#fff}.archive-heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:55px 0 50px}.archive-heading h1{font-size:clamp(40px,5vw,76px);letter-spacing:-2px;margin:0}.archive-heading .eyebrow{color:#999}#workList{border-top:1px solid #d6d4ce}.work-row{display:grid;grid-template-columns:55px minmax(150px,1.1fr) minmax(230px,1.8fr) 95px;gap:25px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid #d6d4ce;padding:34px 8px;color:inherit;font:inherit}.work-row>span{color:#999;font:13px monospace}.work-row strong{font-size:19px;font-weight:600}.work-row p{margin:0;font-size:15px}.work-row small{text-align:right;color:#999}.work-row:hover{background:#eae7df;color:inherit}.work-row:focus-visible,.all-work-button:focus-visible{outline:2px solid #252521;outline-offset:4px}.back-home{display:inline-block;margin:45px 0}.card p{overflow-wrap:anywhere}@media(min-width:651px) and (max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.work-row{grid-template-columns:35px 1fr 1.4fr;gap:15px}.work-row small{grid-column:2;text-align:left}}@media(max-width:650px){.work-row{grid-template-columns:30px 1fr;gap:12px;padding:26px 0}.work-row p,.work-row small{grid-column:2;text-align:left}.archive-heading{padding:40px 0}.all-work- idth:100%;touch-action:none;cursor:grab;margin-bottom:10px}.sort-handle:active{cursor:grabbing}.sortable-image button{padding:9px 12px}.sortable-image a{display:block}.sortable-image button:disabled{opacity:.4;cursor:default}/* Editorial portfolio refresh */
:root{--paper:#f5f6f3;--ink:#1b2629;--muted:#657173;--line:#d8ddda;--accent:#315e69}
body{background:var(--paper);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,"PingFang SC",sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
header,main,footer{max-width:1480px;padding-left:clamp(22px,4vw,70px);padding-right:clamp(22px,4vw,70px)}
header{align-items:center;padding-top:24px;padding-bottom:24px;border-color:var(--line)}
header>a{font-size:15px;font-weight:700;letter-spacing:.12em}
header nav{align-items:center;gap:clamp(18px,2.4vw,36px)}
header nav a{font-size:14px;color:var(--muted);transition:color .2s}
header nav a:hover{color:var(--accent)}
header nav a:last-child{color:var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:600;color:var(--accent)}
#public .intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);align-items:end;gap:50px;margin:0;padding:72px 0 62px;border-bottom:1px solid var(--line)}
#public .intro h1{font-size:clamp(54px,6.4vw,92px);line-height:.98;letter-spacing:-.065em;font-weight:550;margin:0 0 24px}
#public .intro h1 span{color:var(--accent)!important}
#public .intro .eyebrow{margin:0}
#public .intro>p{font-size:16px;line-height:1.9;letter-spacing:.02em;color:var(--muted);margin:0 0 3px}
#public section{padding:50px 0;border-color:var(--line)}
#works .meta{align-items:center;padding:0}
#works .small{font-size:12px;letter-spacing:.13em;color:#81908e}
#featured{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(30px,4vw,60px);row-gap:66px;margin-top:30px!important}
#featured .card{min-width:0;outline-offset:5px}
#featured .cover{width:100%;aspect-ratio:16/9;object-fit:contain;background:#e9ecea;border:1px solid #e4e8e5;transition:filter .25s,transform .35s}
#featured .card:hover .cover{filter:brightness(.97);transform:translateY(-3px)}
#featured .meta{align-items:flex-start;gap:14px;padding:17px 0 0}
#featured .meta strong{font-size:20px;line-height:1.45;letter-spacing:-.02em;font-weight:600;overflow-wrap:anywhere}
#featured .meta span{font-size:21px;color:var(--accent)}
#featured .card p{font-size:15px;line-height:1.7;color:var(--muted);margin:8px 0 0;max-width:54ch}
.all-work-entry{text-align:right;padding:18px 0 58px;border-color:var(--line)}
.all-work-button{padding:12px 0;gap:26px;border:0;border-bottom:1px solid var(--ink);font-size:16px;font-weight:600}
.all-work-button span{font-size:12px;color:var(--accent)}
.all-work-button:hover{background:transparent;color:var(--accent);border-color:var(--accent)}
#about{grid-template-columns:minmax(260px,1fr) minmax(0,1.3fr);gap:clamp(36px,8vw,120px);align-items:end}
#about h2{font-size:clamp(34px,4vw,54px);letter-spacing:-.04em;line-height:1.1}
#about #name{font-size:clamp(28px,2.8vw,40px);line-height:1.18;letter-spacing:-.035em;overflow-wrap:anywhere}
#about h3{font-size:16px;letter-spacing:.08em;font-weight:600;margin:0 0 18px}
#about p{font-size:17px;line-height:1.9;color:var(--muted)}
#about .avatar{margin:23px 0 20px}
#public .logos{margin-top:26px!important}
#contact{position:relative;isolation:isolate;overflow:hidden;background:#132229;color:#f9fbfa;margin:22px 0 0;padding:54px clamp(24px,4vw,58px)!important;border:0!important}
#contact::before,#contact::after{content:"";position:absolute;inset:-75px;z-index:0;pointer-events:none;filter:blur(32px)}
#contact::before{background:radial-gradient(ellipse 38% 85% at 10% 82%,rgba(35,133,169,.48),transparent 78%),radial-gradient(ellipse 42% 100% at 52% 8%,rgba(77,92,172,.43),transparent 78%),radial-gradient(ellipse 38% 95% at 96% 72%,rgba(130,83,153,.38),transparent 78%)}
#contact::after{background:radial-gradient(ellipse 32% 85% at 32% 2%,rgba(50,164,150,.27),transparent 78%),radial-gradient(ellipse 34% 85% at 88% 110%,rgba(194,117,84,.25),transparent 78%);filter:blur(40px)}
#contact>*{position:relative;z-index:1}
#contact .eyebrow{color:#a8c7cb}
#contact .contact{font-size:clamp(34px,4vw,56px);line-height:1.2;letter-spacing:-.035em;font-weight:500;margin:19px 0 15px}
#contact p{color:#b6c5c6;margin:0}
footer{padding-top:26px;padding-bottom:42px;font-size:12px;letter-spacing:.1em;color:var(--muted)}
button:focus-visible,a:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:750px){#public .intro{grid-template-columns:1fr;gap:26px;padding:50px 0 46px}#public .intro h1{font-size:clamp(52px,10vw,72px)}#public .intro>p{max-width:100%}#featured{grid-template-columns:1fr;row-gap:44px}#public section{padding:42px 0}.all-work-entry{padding:10px 0 42px}#about{grid-template-columns:1fr;gap:30px}#contact{margin-top:10px}header{gap:20px}header nav{gap:14px;flex-wrap:wrap;justify-content:flex-end}header nav a{font-size:13px}}
@media(max-width:430px){#public .intro h1{font-size:50px}#featured .meta strong{font-size:18px}#featured .card p{font-size:14px}header>a{font-size:13px}header nav{gap:10px}}

</style></head><body><header><a href="./">PORTFOLIO®</a><nav><a href="./#works">作品</a><a href="./#about">关于</a><a href="./#contact">联系</a></nav></header><main><div id="public"><div class="intro"><div><h1>Selected<br>Works<span style="color:#999">.</span></h1><p class="eyebrow">UI & VISUAL DESIGN · SINCE 2018</p></div><p>用视觉讲述想法，<br>以设计连接品牌与体验。</p></div><section id="works"><div class="meta"><span class="eyebrow">01 / 精选案例</span><span class="small">SELECTED PROJECTS</span></div><div class="grid" id="featured" style="margin-top:28px"></div></section><div class="all-work-entry"><a class="all-work-button" href="./#/all">查看更多 <span>ALL WORK →</span></a></div><section id="about" class="about"><div><span class="eyebrow">02 / ABOUT ME</span><div id="avatar" class="avatar" aria-label="个人头像"></div><h2 id="name"></h2></div><div><h3>UI / 视觉设计师</h3><p id="bio"></p></div></section><section><span class="eyebrow">03 / 合作品牌</span><div class="logos" style="margin-top:35px" id="logos"></div></section><section id="contact"><span class="eyebrow">LET’S CREATE SOMETHING GOOD.</span><h2 class="contact">一起，做点好设计。↗</h2><p id="contactText"></p></section></div><div id="projectPage" hidden></div><div id="archive" hidden><div class="archive-heading"><h1>项目合集</h1><span class="eyebrow">ALL WORK</span></div><div id="workList"></div><a class="back-home" href="./">← 返回精选案例</a></div></main><footer>© <span id="year"></span> DESIGN PORTFOLIO · 自 2018 年</footer><script>let data;const $=s=>document.querySelector(s);const el=(tag,text)=>{let e=document.createElement(tag);if(text)e.textContent=text;return e};function image(src){let i=el('img');i.src=src;i.loading='eager';i.alt='作品展示';return i}function card(p,i){let c=el('article');c.className='card';let im=p.cover?image(p.cover):el('div',String(i+1).padStart(2,'0'));im.className='cover'+(p.cover?'':' placeholder');c.append(im);let m=el('div');m.className='meta';m.append(el('strong',p.title),el('span','↗'));c.append(m,el('p',p.summary));c.tabIndex=0;c.setAttribute('role','button');c.onclick=()=>{location.href=projectURL(p)};c.onkeydown=e=>{if(e.key==='Enter')c.click()};return c}function renderAvatar(target){let box=$(target);box.replaceChildren();if(data.avatar){let im=image(data.avatar);im.alt='个人头像';box.append(im)}else box.append(el('span','头像待上传'));}function render(){renderAvatar('#avatar');let f=data.projects.filter(p=>p.featured).slice(0,6);$('#featured').replaceChildren(...f.map(card));$('#name').textContent=data.name;$('#bio').textContent=data.bio;$('#contactText').textContent=data.contact;let t=el('div');t.className='track';t.style.setProperty('--logo-duration',Math.max(24,data.logos.length*4)+'s');for(let copy=0;copy<2;copy++){let group=el('div');group.className='logo-set';if(copy)group.setAttribute('aria-hidden','true');data.logos.forEach(src=>{let im=image(src);im.loading='eager';im.alt=copy?'':(data.logoLabels?.[src]||'合作品牌 Logo');group.append(im)});t.append(group)}let logos=$('#logos');logos.classList.toggle('logos-static',data.logos.length<3);logos.replaceChildren(data.logos.length?t:el('p','合作品牌 Logo 待添加'));}function projectURL(p){return './#/project/'+encodeURIComponent(p.id)}function renderProject(){let root=$('#projectPage');let id;try{id=decodeURIComponent(location.hash.slice('#/project/'.length))}catch{}let index=data.projects.findIndex(p=>p.id===id);let back=el('a','← 返回作品列表');back.href='./#/all';back.className='back-home';root.replaceChildren(back);if(index<0){root.append(el('h2','作品不存在或已移除'));return}let p=data.projects[index];document.title=p.title+' · 作品详情';let head=el('div');head.className='project-heading';head.append(el('span',p.category||'PROJECT / DESIGN'),el('h1',p.title));root.append(head);if(p.cover){let im=image(p.cover);im.className='project-image';root.append(im)}if(p.images?.length){let gallery=el('section');gallery.className='project-gallery';gallery.append(el('h2','设计展示'));for(let src of p.images){let im=image(src);im.className='project-image';gallery.append(im)}root.append(gallery)}for(let [k,title]of [['summary','项目概述'],['background','项目背景与目标'],['role','我的职责'],['approach','设计思路'],['outcome','设计成果'],['description','作品介绍']]){if(!p[k]?.trim())continue;let section=el('section');section.className='project-copy';section.append(el('h2',title),el('p',p[k]));root.append(section)}let nav=el('nav');nav.className='project-pagination';for(let [n,label]of [[index-1,'← 上一个作品'],[index+1,'下一个作品 →']]){if(!data.projects[n])continue;let a=el('a',label+' · '+data.projects[n].title);a.href=projectURL(data.projects[n]);nav.append(a)}root.append(nav)}function renderArchive(){document.title='项目合集 · 设计作品集';$('#workList').replaceChildren(...data.projects.map((p,i)=>{let row=el('button');row.type='button';row.className='work-row';row.append(el('span',String(i+1).padStart(2,'0')),el('strong',p.title),el('p',p.summary),el('small',p.category||'未分类'));row.onclick=()=>card(p,i).click();return row}));}

data = {"name":"刘梓漪.Lizzy","bio":"我是一名 UI 视觉设计师和产品经理，自 2018 年起参与数字产品设计，也有产品经理工作经历。项目涉及金融、医疗、智能出行、消费电子、品牌电商、企业服务及智慧城市，包括首驱经营数据平台等项目。我设计过面向消费者的网站与商城，也参与过企业内部业务平台、移动应用与数据大屏。面对不同的使用场景，我注重梳理业务需求、信息结构和操作流程，以清晰、有质感的视觉表达，让复杂内容更容易理解和使用。","contact":"电话：18380803371         邮箱：18380803371@163.com","logos":["assets/4f8168fb-e7ea-4eb5-bd9c-22a931995000.png","assets/bcfca082-66e2-4ebb-9016-1de2ce9e4078.png","assets/55fb6ce7-046c-47b8-8c3b-729da1d6e794.png","assets/443e85b7-5745-4d5a-aa7d-242e0e9642c5.png","assets/f8d535aa-e619-49f7-8606-6941f7659d58.png","assets/bb259f77-8d5c-45ae-bbd2-a63d16d0cff9.png","assets/d89a0c21-e61c-4bb8-89a6-8e7ed850bb73.png","assets/a66745bf-7f43-4c80-8d13-468eed37cf95.png","assets/234af765-787d-408a-b399-45bc030626bc.png","assets/0ab228e5-05db-4168-b0a7-04fad8082edc.png","assets/fe4c09b4-7f8b-4f67-8843-c604ec4546e4.png","assets/492d8681-5e96-456f-a0f7-3840b12c5db7.png"],"projects":[{"title":"itel 电商官网与移动端体验设计","summary":"围绕 itel 多品类产品展示与线上选购场景，设计覆盖品牌官网、产品列表、服务支持及移动端营销活动的页面体验，以统一的视觉语言连接品牌认知、产品探索与购买引导。","description":"本项目的设计重点，是在多品类、多页面与不同活动场景之间建立一致性。品牌页面注重形象与内容叙述，产品页面强调分类和信息效率，营销页面突出利益点与参与反馈，通过不同的信息密度和视觉节奏满足各自的使用需求。","featured":true,"cover":"assets/ff84d9d4-7fb7-4867-9ef5-7b341e487daa.png","images":["assets/6371b807-e648-46e8-b782-f1fb6ed76c33.png","assets/783d4f0d-1e0e-48ce-bd08-61442705c9f2.png","assets/731db2af-7d4c-48bf-a79f-8f65bba8d3b7.png","assets/9eb1c96b-c078-4c08-b9b9-3cf09b6344d9.png"],"id":"project-1","category":"消费电子 · 品牌电商 · Web / 移动端","background":"随着手机、智能穿戴及生活电器等产品内容在同一网站中呈现，官网需要兼顾品牌表达、产品查找、选购引导与服务支持。\n\n本项目围绕这些不同的浏览需求展开设计：通过清晰的栏目层级与产品分类，让用户快速找到感兴趣的产品；通过品牌内容与产品视觉建立整体认知；同时延伸移动端页面及优惠活动体验，让产品浏览与营销参与形成连贯的路径。","role":"负责项目的 UI 与视觉设计，围绕桌面端与移动端页面梳理信息层级、页面布局和视觉表达。\n\n设计内容涵盖首页、产品系列与列表、产品参数、品牌介绍、搜索、门店查询及下载支持等页面，并延伸至移动端优惠券、邀请助力活动、个人中心与订单详情等场景，保持不同页面之间的视觉一致性。","approach":"1、以品牌红建立统一识别\n将红色集中应用于导航选中态、主要按钮、价格和状态标识，配合白色与浅灰底色，让产品图片成为页面主体，同时突出关键操作。\n\n2、用分层结构组织多品类内容\n首页通过主视觉、新品、热门产品、品牌内容与新闻逐步展开；产品页面结合系列导航、主题横幅和产品卡片，帮助用户从整体浏览进一步定位具体型号。\n\n3、平衡产品表现与信息阅读\n在重点展示区域使用大幅产品图与场景化视觉强化吸引力，在列表与参数区域采用规则网格、统一卡片和清晰文字层级，兼顾视觉表现与信息查找。\n\n4、针对移动端重新安排内容\n将桌面端的横向导航与多列信息转换为折叠菜单、纵向内容和双列产品卡片，并通过色彩选项、分类切换与明确的操作入口，适应小屏浏览和触控操作。\n\n5、区分日常浏览与活动参与的视觉节奏\n官网常规页面保持简洁，营销活动则采用红橙渐变、优惠券造型和商品组合视觉，突出活动氛围。通过倒计时、进度展示、优惠券状态及规则说明，呈现参与条件与当前进展。","outcome":"形成了覆盖桌面端与移动端的多场景界面方案，将品牌展示、产品浏览、服务查询和营销活动纳入一致的视觉体系。\n\n通过统一的导航、产品卡片、按钮与状态表达，为不同产品系列及活动内容提供了可延展的页面样式；同时在移动端呈现优惠领取、活动参与、个人中心与订单信息等关键界面，补充了产品选购之外的用户体验。"},{"title":"Dyson 商城官网与移动端体验设计","summary":"围绕 Dyson 产品展示与选购体验，设计覆盖商城首页、产品分类、商品选择及售后支持的网页界面，并延伸至移动端，让产品科技感与清晰的购买、服务路径保持一致。","description":"这个项目的重点是平衡“展示”与“查找”：商城页面让产品视觉和技术内容更有吸引力，支持页面则强调分类效率与操作清晰度。两类页面使用一致的品牌语言，但根据用户任务调整信息密度。","featured":true,"cover":"assets/2a649bd8-7538-4c89-94f1-5b305c32e0a6.png","images":["assets/2af2884c-9484-42fc-963e-459171508024.png","assets/b2df07fe-55a9-4348-8549-145560634a61.png","assets/3963831b-3f26-43c0-8f06-7b3d78d77057.png"],"id":"project-2","category":"家电与消费科技 · 品牌电商 · Web / 移动端","background":"Dyson 官网需要同时承载产品介绍、分类浏览、购买引导和售后服务。不同品类的展示重点各不相同，用户也可能带着“了解新品”“寻找适合的产品”或“解决使用问题”等不同目标进入网站。\n\n设计目标是建立清晰的内容层级，让用户能从首页快速进入产品与服务页面；在突出产品技术和视觉质感的同时，降低查找商品、比较型号和获取支持的成本。","role":"负责官网相关页面的 UI 与视觉设计，梳理桌面端及移动端的信息结构、页面布局和交互呈现。设计范围包括商城首页的内容模块、产品分类与选购页面，以及支持中心、故障排查等服务场景。","approach":"以大幅产品与场景图片作为视觉焦点，配合简洁的黑白页面框架，让产品本身和技术特点成为浏览重点。首页通过主视觉、科技品类、产品卡片和内容入口逐层展开，帮助用户从品牌内容进入具体产品。\n\n产品页面使用明确的分类、型号图片和信息层级，方便用户逐步缩小选择范围。支持页面则按机器类型、常见问题及服务方式组织内容，让带着具体问题进入网站的用户更快找到入口。\n\n移动端将桌面端的多列布局调整为纵向浏览，并保留清晰的菜单、搜索、购物袋和关键操作入口，使产品展示与服务信息适应小屏阅读。","outcome":"形成了覆盖商城展示、产品浏览与售后支持的桌面端和移动端界面方案。通过统一的导航、卡片、图标及文字层级，让不同品类和服务内容在同一网站中保持连贯的视觉体验。"},{"title":"U利来｜联合利华经销商订货与门店经营平台","summary":"面向联合利华合作经销商与商家，设计集产品订货、代客下单、订单管理、优惠权益和经营数据于一体的移动端平台，帮助商家更高效地采购联合利华旗下产品、管理门店业务。","description":"U利来的设计重点在于服务商家的实际采购流程。页面不仅要展示商品，还要让用户快速判断“能否订、订多少、有什么优惠、订单到哪一步”。因此，设计中优先保证价格、规格、起订条件和订单状态的可读性，再通过品牌内容与活动模块提升浏览体验。","featured":true,"cover":"assets/094da98c-abc6-4eb6-8142-d20f0e994ea1.png","images":["assets/45711e9b-efc0-41fc-a3b3-42a510d39c20.png"],"id":"project-3","category":"快消品 · B2B 订货平台 · 移动端 / 小程序","background":"经销商和门店采购联合利华旗下产品时，需要快速查找商品、了解整箱规格与起订条件，并完成下单及后续订单处理。平台还要支持代客下单、门店管理、优惠活动和经营数据查看，因此用户的任务比普通消费者购物更复杂。\n\n项目目标是把商品采购与日常经营操作集中在清晰的移动端流程中：让商家更容易找到适合门店的产品，理解价格、起订量和优惠规则，并及时跟进订单与门店状态。","role":"负责平台的移动端 UI 与视觉设计，梳理核心业务页面的信息层级和操作流程。设计范围涵盖首页推荐、商品分类与搜索、商品详情、购物车与结算、订单管理、门店选择、个人中心、优惠权益，以及门店经营数据等页面。","approach":"围绕高频订货任务组织入口。 首页集中展示搜索、常购清单、推荐商品及促销活动，让熟悉商品的商家能够快速复购，也方便用户发现新品和活动商品。\n\n突出采购决策所需的信息。 商品卡片与详情页重点呈现价格、包装规格、起订数量、库存及优惠标签；购物车与结算页清晰显示商品数量、整箱价格和可用优惠，减少反复核对。\n\n支持多角色、多门店业务。 将代客下单、选择门店、订单处理和经营统计设置为明确的任务入口，使采购与门店管理能够在同一平台内完成。\n\n让优惠规则更容易理解。 通过优惠券、满减、积分和会员权益的视觉区分，帮助用户识别可用优惠及使用条件，同时保持下单主流程清晰。\n\n统一商品与经营页面的视觉语言。 以联合利华品牌蓝建立主要操作和导航识别，商品与营销区域使用更鲜明的色彩突出活动信息；数据页面采用图表与卡片呈现金额、订单和门店状态。","outcome":"形成了一套覆盖商品发现、订货、订单跟进与门店经营的移动端界面方案。通过统一的商品卡片、状态标签、操作按钮和数据展示方式，让联合利华旗下不同品牌的产品能够在同一平台中清晰呈现，并支持经销商和商家的日常业务操作。"},{"title":"TCL 印度站｜品牌电商网站设计","summary":"面向印度市场的 TCL 品牌电商网站设计，涵盖首页、商品展示、商品详情、购物车及移动端购物体验。","description":"作品展示了 TCL 印度站的首页、商品详情、购物车及移动端页面设计。页面中的价格和促销信息以设计图展示内容为准。","featured":true,"cover":"assets/7bb6932f-90b2-4664-9fd3-6a00961d7a27.png","images":["assets/26f19420-d763-40db-bd53-ad0ad2ad66d4.png","assets/be2a5ea8-c972-4479-9490-1f778149cd5f.png"],"id":"project-4","category":"消费电子 / 品牌电商 / 响应式网站","background":"TCL 印度站需要同时展示电视、音响及家电产品，并承接用户从了解产品到购买的过程。设计目标是让用户快速发现适合的产品、比较关键参数与优惠信息，并顺畅完成加购和结算。","role":"负责网站的界面与视觉设计，包含首页、商品详情、商品推荐与对比、购物车，以及移动端页面的适配设计。","approach":"首页以产品场景和主推商品建立品牌印象，再通过分类入口与推荐模块引导浏览。商品详情页集中呈现产品图片、核心功能、尺寸与颜色选择、价格、优惠、评价及型号对比，帮助用户做购买决定。购物车明确展示商品、优惠和订单金额；移动端则调整信息层级与操作入口，保持浏览和购买流程连贯。","outcome":"完成覆盖桌面端与移动端的电商页面设计方案，形成从商品发现、了解与比较，到加购结算的完整体验。"},{"title":"九号 Segway｜商城与内部业务 App","summary":"围绕九号 Segway 产品销售与业务协作，设计面向消费者的商城网站，以及支持订单、门店服务和履约管理的内部 App。","description":"本作品同时展示商城网站和内部 O2O App。设计图中的商品价格、订单数量及业务数据为页面展示内容，不作为项目成效数据。","featured":true,"cover":"assets/6ca8f520-1137-4b78-b532-deaafa58aa2b.png","images":["assets/f17db70c-65ff-4345-8b94-11a1c276a259.png","assets/40789a6e-ff7a-44ad-8809-e2b33a75815f.png","assets/4e2b20e1-6fee-4622-8496-6b2e5a312018.png","assets/f4c86517-2f20-4209-8cab-e9921cb4a5fa.png"],"id":"project-5","category":"智能出行 / 电商平台 / 业务管理 App","background":"九号 Segway 的产品涵盖电动滑板车、电动自行车及相关配件。消费者需要了解不同车型的特点并完成选购；内部业务人员则需要处理订单、预约、提货与售后等事务。项目希望让两端的信息与操作更清晰。","role":"主要内部 App 的界面及视觉设计及官方商城。商城部分覆盖首页、商品分类、筛选、商品详情和移动端页面；内部 App 部分覆盖工作台、订单、商品与配件、购物车、支付及业务通知等页面。","approach":"商城以产品场景和车型分类引导浏览，在列表页提供筛选与对比，在详情页集中展示性能参数、颜色、配件组合、价格及评价，帮助用户选择。内部 App 将待处理订单、预约和服务事项放在工作台，并按业务流程组织商品选择、库存、履约和支付信息。两端使用统一的品牌元素，同时根据各自用户的任务调整信息层级。","outcome":"形成涵盖消费者选购与内部业务处理的多端设计方案，展示从商品发现、选择与购买，到订单处理和门店服务的主要流程。"},{"title":"BigCommerce 中国官网｜品牌与产品服务网站","summary":"面向中国商家的 BigCommerce 中文官网设计，通过品牌介绍、平台能力、解决方案和服务支持等内容，帮助用户了解产品并找到合适的咨询入口。","description":"展示页面为项目节选，并非官网的全部设计范围。页面中的平台数据和品牌表述以设计时的内容为准。","featured":true,"cover":"assets/31937f57-aa6c-4d88-b57f-9a5058d8b7ea.png","images":["assets/b447971c-5c5d-46d7-8099-4407fccb5bfb.png"],"id":"project-6","category":"SaaS 平台 / 跨境电商 / 企业官","background":"BigCommerce 的平台能力与服务内容较多，中国商家在了解产品时，需要快速判断平台能解决什么问题、适合哪些业务场景，以及如何获得进一步支持。项目目标是将这些信息组织成清晰、易浏览的中文官网体验。","role":"负责中国官网多个页面的界面与视觉设计，梳理页面信息层级、内容模块及咨询入口。本次作品集选取其中部分页面展示，包括首页、品牌介绍和帮助中心；其他已设计页面未全部收录。","approach":"首页先呈现平台价值，再逐步介绍核心能力、业务场景与客户案例，引导用户进一步了解或咨询。品牌介绍页通过图文和数据模块建立信任；帮助中心则突出联系方式与学习资源。整体采用统一的版式、图形和色彩规范，让信息较多的页面仍保持清晰的阅读顺序。","outcome":"完成 BigCommerce 中国官网多个页面的设计方案，形成一致的品牌视觉与内容呈现方式。本作品集展示其中具有代表性的页面。"},{"title":"HONOR.荣耀 (荷兰站)","summary":"面向荷兰市场的 HONOR 电商网站设计，涵盖首页、商品详情与购物车，通过清晰的产品展示和购买信息，连接用户从浏览到下单的过程。","description":"本作品集展示的是荣耀荷兰站的部分页面。图中的商品价格和促销内容属于页面展示信息，不作为项目成效数据。","featured":false,"images":[],"id":"project-7","category":"消费电子 / 品牌电商 / 海外网站","background":"荷兰用户在选购手机、手表等产品时，需要同时了解产品特点、价格、优惠及配送服务。项目希望在保持 HONOR 品牌形象的同时，让当地用户更容易发现产品、比较选择并完成购买。","role":"负责荣耀荷兰站相关页面的界面与视觉设计，包括首页的产品推荐与活动展示、商品详情页的信息组织，以及购物车页面的结算信息呈现。","approach":"首页以重点产品和活动信息吸引用户浏览，并通过推荐模块引导选购。商品详情页将产品图片、规格选择、优惠、搭配商品与价格汇总按购买决策顺序呈现；购物车突出商品明细、费用和结算入口。页面使用一致的版式与视觉元素，保持浏览和购买过程连贯。","outcome":"完成首页、商品详情及购物车等页面的设计展示，形成从产品发现、了解与选择，到购物车结算的主要流程。","cover":"assets/9d296251-18db-45ff-9582-8bf26413e07d.png"},{"id":"b86bb91f-89bf-4612-b440-e25cec70df87","title":"追觅.首驱","summary":"面向总部、区域、经销商及门店人员的移动端经营数据平台，集中展示销售目标、整车 SO/SI 趋势、车型表现和门店运营情况。","description":"本作品展示追觅首驱内部业务场景的界面设计。图中的销量、库存、目标及门店数据仅用于展示设计，不代表实际经营结果。","featured":false,"images":[],"category":"智能出行 / 企业内部系统 / 数据看板 App","background":"多层级业务人员关注的数据范围和工作重点不同，需要快速了解目标进度、销售趋势及门店表现。项目通过移动端看板整合关键指标，并支持按省区、城市、经销商和门店逐级查看，帮助使用者定位需要关注的业务情况。","role":"负责 App/Web 的界面与视觉设计，包括经营首页、数据报表、区域与门店详情、车型排行、公告通知和个人中心等页面。","approach":"首页优先呈现目标达成、SO/SI、门店效率等核心指标，让使用者打开 App 即可掌握概况。报表页支持按时间、区域和业务层级查看数据；趋势图与车型排行用于进一步分析变化。通过统一的卡片、图表和状态样式，降低不同角色阅读数据的成本。","outcome":"完成覆盖经营概览、分级报表、车型分析和消息通知的移动端设计方案，让内部使用者能够从整体数据逐步查看到具体区域与门店。","cover":"assets/511e4381-fc22-4248-b31b-a05c85dbc794.png"},{"id":"0df00cbc-d445-4a29-aac5-c120581c609f","title":"安世半导体中国商城｜电子元器件采购平台","summary":"面向中国市场的安世半导体线上商城设计，整合器件检索、产品参数、BOM 配单、样品申请与订单管理，支持用户从选型到采购。","description":"作品展示商城主要页面与渠道合作相关页面。设计图中的价格、库存和订单信息为页面展示内容，不作为实际业务数据。","featured":false,"images":["assets/6542f619-84d8-4bda-8d47-99fd20825875.png"],"category":"半导体 / B2B 电商 / 企业采购平台","background":"电子元器件采购涉及型号、技术参数、价格梯度和库存等信息。用户需要快速找到符合需求的器件，并在确认资料后完成样品申请或批量采购。项目目标是让专业信息易于查找，同时理顺选型、配单和下单流程。","role":"负责商城相关页面的界面与视觉设计，包括首页、产品列表、商品详情、购物车与结算、渠道合作介绍及会员中心、活动页等页面。","approach":"首页提供产品分类、搜索和常用业务入口；列表页突出型号、描述、价格、库存及数据手册，方便用户对照选型。详情页集中呈现规格与可采购数量，并连接加购操作；购物车和会员中心则清晰展示订单明细与状态。通过统一的信息层级，让专业用户减少在页面间反复查找。","outcome":"完成覆盖产品发现、器件选型、采购下单及订单查看的商城页面设计方案，并形成一致的品牌视觉与信息展示方式。","cover":"assets/ebac3f64-e011-4d0c-9066-c80aefce6643.png"},{"id":"bfad8035-b785-4b8b-911b-4223dd89cc0e","title":"智慧蓉城.大屏","summary":"面向城市运行与应急指挥场景的大屏平台设计，整合事件信息、地图点位、实时视频、风险监测和会议调度，辅助工作人员集中查看与协同处置","description":"本作品集展示平台的部分指挥场景与界面方案。图中的事件、人员、设备及监测数据为设计展示内容。","featured":false,"images":["assets/ec090b1e-2082-4cee-af94-b9c854aaf8fd.png","assets/9d329058-5a3d-4401-9e77-72c76132b0f2.png","assets/56a698bd-2b8e-4a57-8122-195be1b06b3b.png"],"cover":"assets/51c17887-07f6-46c1-aa4a-778e806ba342.png","category":"智慧城市 / 政务平台 / 指挥大屏","background":"城市运行涉及事件、设备、视频和人员等多类信息。工作人员需要在同一界面快速掌握现场情况、定位相关资源，并与不同岗位协同处理。项目目标是让复杂信息在指挥大屏上清晰呈现，缩短查找与切换信息的过程。","role":"负责融合指挥平台的界面与视觉设计，涵盖指挥总览、事件信息、地图资源、视频中枢、风险点位、会议调度及事件进度等模块。","approach":"以地图和视频作为核心工作区域，周边布置事件详情、人员信息、风险数据和处置进度。通过模块化面板、明确的状态颜色及统一的图标规范，区分信息优先级；针对不同指挥情境设计可切换的布局，让工作人员按任务查看相关内容。","outcome":"形成覆盖事件查看、点位定位、视频联动和协同调度的指挥大屏设计方案，展示不同信息组合下的页面布局与操作方式。"},{"id":"d02de969-e00f-4f5a-92b3-4050e6958193","title":"振华重工 Terminexus｜港机备件服务平台","summary":"面向港机设备用户的备件服务平台设计，将备件查找、BOM 选件、商品采购与订单数据集中到线上，支持专业用户处理日常备件业务。","description":"项目实际设计范围大于本次展示内容；这里重点呈现平台的备件采购与业务管理体验。设计图中的订单金额、数量和图表数据仅用于页面展示。","featured":false,"images":["assets/c95bfcd7-c4ea-4c00-a28c-f3df09879a00.png"],"category":"工业互联网 / 港机设备 / B2B 采购平台","background":"港机备件品类多、型号信息复杂，用户需要准确找到适配设备的零件，并查看商品、订单和采购信息。项目希望通过清晰的分类、搜索及业务页面，连接备件查找、选购和订单跟进的过程。","role":"负责平台多个页面的界面与视觉设计。本次作品集选取首页、业务仪表台、商品展示、BOM 选件及详情信息等页面，其他设计页面未全部收录。","approach":"首页以搜索、业务入口和合作伙伴信息建立清晰的访问路径；商品页面突出零件名称、型号及操作入口。BOM 页面结合设备结构与零件清单，帮助用户按部位查找配件；仪表台通过图表和订单状态呈现业务概况。针对信息密集的页面，统一表格、卡片和筛选控件的层级，方便快速浏览与定位。","outcome":"形成覆盖备件发现、BOM 选件、采购信息及业务数据查看的多页面设计方案。作品集展示的是其中具有代表性的页面。","cover":"assets/648b1828-8567-4c6e-b55e-7364a5635cf1.png"}],"logoLabels":{"assets/bcfca082-66e2-4ebb-9016-1de2ce9e4078.png":"dyson","assets/f8d535aa-e619-49f7-8606-6941f7659d58.png":"itel"},"avatar":"assets/9f035da9-545a-4afe-ae8c-370e5c8b8a11.png"};
function route(){
  const hash = location.hash;
  const isProject = hash.startsWith('#/project/');
  const isArchive = hash === '#/all';
  document.querySelector('#public').hidden = isProject || isArchive;
  document.querySelector('#projectPage').hidden = !isProject;
  document.querySelector('#archive').hidden = !isArchive;
  if(isProject) renderProject();
  else if(isArchive) renderArchive();
  else { document.title = 'Selected Works · 设计作品集'; render(); }
  if(hash && !isProject && !isArchive) requestAnimationFrame(() => document.querySelector(hash)?.scrollIntoView());
  else scrollTo(0, 0);
}
document.querySelector('#year').textContent = new Date().getFullYear();
addEventListener('hashchange', route);
route();
</script></body></html>
